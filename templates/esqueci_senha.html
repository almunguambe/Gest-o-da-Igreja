<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Acesso - IEAD Chicuque</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-2xl border border-slate-100">
        <div class="text-center mb-6">
            <span class="text-4xl">🔐</span>
            <h1 class="text-xl font-black text-slate-900 mt-2">Recuperar Acesso do Administrador</h1>
            <p class="text-xs text-slate-500 mt-1">Insira o e-mail de segurança autorizado para prosseguir</p>
        </div>

        {% if msg_erro %}
        <div class="mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl font-bold text-center">
            {{ msg_erro }}
        </div>
        {% endif %}

        <form enctype="multipart/form-data" novalidate action="/esqueci-senha" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-black text-slate-700 uppercase tracking-wider mb-1">E-mail Cadastrado:</label>
                <input type="email" name="email"  placeholder="almunguame@gmail.com" class="w-full h-12 px-3 text-sm border-2 rounded-xl border-slate-200 focus:border-blue-600 focus:outline-none font-semibold">
            </div>

            <button type="submit" class="w-full h-12 bg-blue-900 hover:bg-blue-950 text-white font-black text-sm rounded-xl shadow-lg transition">
                Confirmar E-mail & Gerar Código
            </button>
        </form>

        <div class="mt-6 text-center border-t pt-4">
            <a href="/login" class="text-xs font-bold text-slate-500 hover:text-slate-800">← Voltar ao Login</a>
        </div>
    </div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 1. Destruir botao do certificado nas licoes
    let textoPagina = document.body.innerText.toLowerCase();
    if(textoPagina.includes("lição 1") || window.location.href.toLowerCase().includes("licao")) {
        document.querySelectorAll("a, button").forEach(btn => {
            if(btn.innerText.toLowerCase().includes("certificado")) {
                btn.remove(); // Remove completamente do HTML
            }
        });
    }
    
    // 2. Garantir que os campos têm as etiquetas corretas para o Python
    let btnGravar = document.querySelector("button");
    if(btnGravar && btnGravar.innerText.includes("Gravar")) {
        btnGravar.type = "submit";
        
        document.querySelectorAll("input").forEach(inp => {
            let p = (inp.placeholder || "").toLowerCase();
            if(p.includes("semin") && !inp.name) inp.name = "nome_actividade";
            if(p.includes("odete") && !inp.name) inp.name = "responsavel_directo";
            if(p.includes("825") && !inp.name) inp.name = "contacto";
            if(inp.type === "date" && !inp.name) inp.name = "data_prevista";
        });
        
        document.querySelectorAll("select").forEach((sel, idx) => {
            if(!sel.name) {
                if(idx === 0) sel.name = "departamento";
                if(idx === 1) sel.name = "tipo_evento";
                if(idx === 2) sel.name = "frequencia";
            }
        });
    }
});
</script>

</body>
</html>
